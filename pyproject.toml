[project]
name = "colony-detector"
version = "1.0.0"
description = "Accurate CFU / colony counting on agar plate images"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]
